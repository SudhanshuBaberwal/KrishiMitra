
server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: krishimitra-backend

  mongodb:
    uri: ${MONGODB_URI}
    database: krishimitra

  data:
    mongodb:
      auto-index-creation: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  market:
    data-gov-api-key: ${DATA_GOV_IN_API_KEY}
    data-gov-resource-id: 9ef84268-d588-465a-a308-a864a43d0070
    data-gov-page-size: 100
    ingestion-key: ${MARKET_INGEST_KEY}
  advisory:
    ingestion-key: ${ADVISORY_INGEST_KEY}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

  show-actuator: false